name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/stoic-mendel-chbu7w, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '*.md' --exclude '.gitignore' ./ _site/
          # model.richiemiller.com serves the modelling site (noir-2) at the root; the concepts stay at their own paths
          mv _site/index.html _site/concepts.html
          rsync -a --exclude 'index.html' noir-2/ _site/
          sed -e 's#data-base="\.\./"#data-base=""#' -e 's#"\.\./assets/#"assets/#g' noir-2/index.html > _site/index.html
          # the old /noir-2/ address now points to the root
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Richie Miller</title><link rel="canonical" href="https://model.richiemiller.com/"><meta http-equiv="refresh" content="0;url=/"><script>location.replace("/"+location.search+location.hash)</script>' > _site/noir-2/index.html
          # short links for applications: /digitals and /off-duty land on their sections
          for s in digitals off-duty; do mkdir -p _site/$s; printf '%s\n' "<!doctype html><meta charset=\"utf-8\"><title>Richie Miller</title><meta name=\"robots\" content=\"noindex\"><link rel=\"canonical\" href=\"https://model.richiemiller.com/#$s\"><meta http-equiv=\"refresh\" content=\"0;url=/#$s\"><script>location.replace(\"/#$s\")</script>" > _site/$s/index.html; done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
