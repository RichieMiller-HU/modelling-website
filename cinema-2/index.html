<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Richie Miller — Model</title>
<meta name="description" content="Richie Miller, model. Portfolio in three acts, studio film, measurements and booking.">
<meta property="og:title" content="Richie Miller — Model">
<meta property="og:image" content="../assets/photos/rm-16.jpg">
<meta name="theme-color" content="#050505">
<!--
  Cinema v2. Concept, code and motion written for this project.
  Vendored libraries (see js/): GSAP 3.15.1 + ScrollTrigger (GSAP Standard "No Charge" licence, js/LICENSE-gsap.txt),
  Lenis 1.3.27 (MIT, js/LICENSE-lenis.txt). The stacked clip-path reveal is a well-known pattern popularised by
  Codrops tutorials (MIT, LICENSE-template.txt). Fonts: Libre Caslon Display and Fragment Mono, both SIL OFL 1.1 (fonts/).
-->
<link rel="preload" href="fonts/libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fragment-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/video/studio-poster.jpg" as="image">
<style>
@font-face{font-family:"Caslon Display";src:url(fonts/libre-caslon-display-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Fragment Mono";src:url(fonts/fragment-mono-latin-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}

:root{
  --black:#050505;--bone:#ecebe8;--ember:#110b08;
  --ink:#ece7df;--ink-2:#0d0d0c;
  --display:"Caslon Display","Libre Caslon Display",Georgia,serif;
  --mono:"Fragment Mono",ui-monospace,Menlo,Consolas,monospace;
  --g:clamp(14px,2.1vw,30px);
  --hud-x:calc(var(--g) + 30px);
  --sab:env(safe-area-inset-bottom,0px);
  --io:cubic-bezier(.76,0,.24,1);--out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--black)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:var(--black);color:var(--ink);font:400 12px/1.5 var(--mono);overflow-x:hidden;overflow-x:clip}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;text-transform:inherit}
ul{list-style:none}
::selection{background:var(--ink);color:var(--black)}
:focus-visible{outline:1px solid currentColor;outline-offset:4px}

/* the one label style: small, tracked, uppercase mono */
.lbl{font:400 10.5px/1.25 var(--mono);letter-spacing:.16em;text-transform:uppercase;font-feature-settings:"tnum" 1}
.mute{opacity:.55}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- viewfinder HUD ---------- */
.hud{position:fixed;inset:var(--g);bottom:calc(var(--g) + var(--sab));z-index:60;pointer-events:none;color:var(--ink);transition:color .7s var(--io)}
html[data-tone=light] .hud{color:var(--ink-2)}
.hud .c,.hud .h{transition:color .7s var(--io)}
.hud .c{position:absolute;width:18px;height:18px;border:0 solid currentColor}
.hud .c1{left:0;top:0;border-left-width:1px;border-top-width:1px}
.hud .c2{right:0;top:0;border-right-width:1px;border-top-width:1px}
.hud .c3{left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
.hud .c4{right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
.hud .h{position:absolute;display:flex;gap:1.6em;align-items:center;white-space:nowrap}
.h-tl{left:30px;top:3px}.h-tr{right:30px;top:3px}.h-bl{left:30px;bottom:3px}.h-br{right:30px;bottom:3px}
.rec{display:inline-flex;align-items:center;gap:.7em}
.rec b{width:7px;height:7px;border-radius:50%;background:#ff3b2a;animation:blink 1.2s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}
.hud a{pointer-events:auto;padding:6px 0;margin:-6px 0;border-bottom:1px solid transparent;transition:border-color .4s}
.hud a:hover{border-color:currentColor}
#tc{min-width:11ch}

/* ---------- reel: one sticky stage, panels stacked ---------- */
.reel{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden;background:var(--black)}
.panel{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--pbg);color:var(--pink);--pbg:var(--black);--pink:var(--ink)}
.panel.t-light{--pbg:var(--bone);--pink:var(--ink-2)}
.panel.t-colour{--pbg:var(--ember)}
.cam,.frame{position:absolute;inset:0;will-change:transform}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}

/* opening */
.p-open video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.72) contrast(1.06) saturate(.85)}
.bar{position:absolute;left:0;right:0;height:50.5%;background:var(--black);z-index:2;will-change:transform}
.bar.t{top:0;transform-origin:50% 0}.bar.b{bottom:0;transform-origin:50% 100%}
.title{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink);will-change:transform,opacity}
.title .lbl{opacity:.82}
.name{--ls:.2em;font:400 clamp(34px,7.1vw,124px)/1 var(--display);text-transform:uppercase;letter-spacing:var(--ls);margin-right:calc(var(--ls) * -1);margin-block:clamp(16px,2.4vw,34px);font-kerning:normal;white-space:nowrap}
.name span{display:inline-block}
.name .sp{width:.32em}
.cue{position:absolute;left:50%;bottom:calc(var(--g) + 44px + var(--sab));transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink)}
.cue i{width:1px;height:44px;background:currentColor;opacity:.6;transform-origin:50% 0;animation:cue 2.4s var(--io) infinite}
@keyframes cue{0%{transform:scaleY(0)}45%{transform:scaleY(1);transform-origin:50% 0}55%{transform:scaleY(1);transform-origin:50% 100%}100%{transform:scaleY(0);transform-origin:50% 100%}}

/* act cards */
.p-act .cam{display:grid;place-items:center}
.act-in{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 var(--g)}
.act-t{--ls:.24em;font:400 clamp(40px,7.6vw,132px)/1 var(--display);text-transform:uppercase;letter-spacing:var(--ls);margin-right:calc(var(--ls) * -1);white-space:nowrap}
.act-in .rule{display:block;width:clamp(56px,7vw,110px);height:1px;background:currentColor;opacity:.5;margin:clamp(18px,2.4vw,30px) 0 clamp(22px,3vw,40px)}
.act-s{margin-top:clamp(22px,3vw,40px)}

/* scenes */
.p-scene{background:linear-gradient(90deg,var(--bl,var(--pbg)) 0 58%,var(--br,var(--pbg)) 58% 100%);cursor:zoom-in}
.frame img{opacity:0;transition:opacity .8s ease}
.frame img.ld{opacity:1}
.frame img{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0%),#000 calc(100% - var(--fr,0%)),transparent 100%),linear-gradient(180deg,transparent 0,#000 var(--ft,0%),#000 calc(100% - var(--fb,0%)),transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 var(--fl,0%),#000 calc(100% - var(--fr,0%)),transparent 100%),linear-gradient(180deg,transparent 0,#000 var(--ft,0%),#000 calc(100% - var(--fb,0%)),transparent 100%);mask-composite:intersect}
/* cover: close-ups and (on wide screens) landscapes fill the frame */
.lay-cover .frame img,.p-scene.closeup .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;-webkit-mask-image:none;mask-image:none}
.fit-landscape .frame img{width:100%;height:100%;object-fit:cover;-webkit-mask-image:none;mask-image:none}
/* wide portrait: full height, set right of centre, slate in the negative space */
.fit-portrait:not(.closeup) .frame{display:flex;justify-content:center;padding-left:16vw;transform-origin:58% 50%}
.fit-portrait:not(.closeup) .frame img{height:100%;width:auto;max-width:none}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(20deg,#000a 0,#0000 46%);opacity:0}
.closeup .scrim,.fit-landscape:not(.t-light) .scrim{opacity:1}
.closeup .scrim{background:linear-gradient(180deg,#0007 0,#0000 18%),linear-gradient(20deg,#000a 0,#0000 46%)}
.panel.closeup{--pink:var(--ink)}
.slate{position:absolute;z-index:3;left:var(--hud-x);bottom:calc(var(--g) + 52px + var(--sab));max-width:min(30vw,520px)}
.slate .lbl{display:flex;gap:1.6em;margin-bottom:clamp(12px,1.4vw,20px)}
.slate h2{font:400 clamp(38px,4.6vw,78px)/.98 var(--display);letter-spacing:-.012em;text-wrap:balance}
.ln{display:block;overflow:hidden;padding-bottom:.12em;margin-bottom:-.12em}
.ln-i{display:block;will-change:transform}
.view{position:absolute;left:0;top:100%;margin-top:14px;opacity:0}
.view:focus-visible{opacity:1}

/* tall screens (phones, portrait tablets) */
@media (max-aspect-ratio:9/10){
  :root{--hud-x:calc(var(--g) + 4px)}
  .lbl{font-size:9.5px;letter-spacing:.15em}
  .h-tl,.h-bl{left:26px}.h-tr,.h-br{right:26px}
  .hud .h{gap:1.2em}
  .p-scene{background:linear-gradient(180deg,var(--bt,var(--pbg)) 22%,var(--bb,var(--pbg)) 78%)}
  .fit-portrait:not(.closeup) .frame{padding:calc(var(--g) + 44px) 0 0;align-items:flex-start;transform-origin:50% 40%}
  .fit-portrait:not(.closeup) .frame img{height:auto;width:min(100%,calc((100svh - 250px) * .667))}
  .fit-landscape .frame{display:flex;align-items:center;padding-bottom:18vh}
  .fit-landscape .frame img{height:auto;object-fit:contain;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 var(--ft,0%),#000 calc(100% - var(--fb,0%)),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 var(--ft,0%),#000 calc(100% - var(--fb,0%)),transparent 100%)}
  .fit-landscape:not(.t-light) .scrim{opacity:0}
  .p-scene.closeup .frame img{object-position:50% 18%}
  .closeup .scrim{background:linear-gradient(180deg,#0007 0,#0000 14%),linear-gradient(0deg,#000b 0,#0000 42%)}
  .slate{left:var(--hud-x);right:var(--hud-x);bottom:calc(var(--g) + 40px + var(--sab));max-width:none}
  .slate h2{font-size:clamp(34px,10.4vw,52px)}
  .name{font-size:clamp(26px,9.4vw,60px);--ls:.16em}
  .act-t{font-size:clamp(32px,10.6vw,72px)}
}

/* ---------- end credits ---------- */
.credits{position:relative;background:var(--black);color:var(--ink)}
.cr-stage{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 85%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 15%,#000 85%,transparent 100%)}
.roll{position:absolute;left:0;right:0;top:0;padding:0 var(--g);will-change:transform}
.cr-block{margin:0 auto 21vh;max-width:820px}
.cr-block>.lbl{text-align:center;margin-bottom:clamp(22px,3vw,38px)}
.cr-star{text-align:center}
.cr-star .name{margin-block:0;font-size:clamp(30px,5.4vw,92px)}
.cr-rows{display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(22px,3.2vw,52px);row-gap:clamp(10px,1.3vw,16px);align-items:baseline}
.cr-rows dt{text-align:right;opacity:.55;padding-top:.2em}
.cr-rows dd{font:400 clamp(22px,2.3vw,34px)/1.15 var(--display);letter-spacing:.005em;font-feature-settings:"lnum" 1}
.cr-rows dd .imp{font:400 10.5px/1 var(--mono);letter-spacing:.12em;opacity:.55;margin-left:1em;vertical-align:.35em;white-space:nowrap}
.cr-rows .gap{grid-column:1/-1;height:clamp(18px,3vh,30px)}
.cr-final{margin-top:34vh;text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(22px,3.6vh,40px);margin-bottom:0;max-width:none}
.cr-final .mail{font:400 clamp(28px,5.6vw,96px)/1.02 var(--display);letter-spacing:-.012em;transition:opacity .5s;max-width:100%}
.cr-final .mail:hover{opacity:.6}
.cr-links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 34px}
.cr-links a,.cr-links button{border-bottom:1px solid #ece7df40;padding-bottom:5px;transition:border-color .4s}
.cr-links a:hover,.cr-links button:hover{border-color:var(--ink)}
.cr-fin{display:flex;gap:2.2em;justify-content:center;flex-wrap:wrap}
@media (max-aspect-ratio:9/10){
  .cr-rows{column-gap:18px}
  .cr-rows dd{font-size:clamp(20px,5.8vw,28px)}
  .cr-rows dd .imp{display:block;margin:.5em 0 0;vertical-align:0;font-size:9.5px}
  .cr-final .mail{font-size:clamp(25px,7.6vw,44px)}
  .cr-links{flex-direction:column;align-items:center;gap:18px}
}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:90;background:#050505;display:grid;place-items:center;visibility:hidden}
.lb.open{visibility:visible}
.lb:focus{outline:0}
.lb img{max-width:min(94vw,1500px);max-height:calc(100svh - 150px);object-fit:contain;opacity:0;transition:opacity .5s ease}
.lb img.ld{opacity:1}
.lb .lb-bar{position:absolute;left:var(--hud-x);right:var(--hud-x);bottom:calc(var(--g) + var(--sab) + 4px);display:flex;justify-content:space-between;gap:20px;color:var(--ink)}
.lb-x{position:absolute;right:var(--hud-x);top:calc(var(--g) + 4px);z-index:2;color:var(--ink);padding:8px 0}
.lb-p,.lb-n{position:absolute;top:70px;bottom:70px;width:34%;cursor:w-resize}
.lb-p{left:0}.lb-n{right:0;cursor:e-resize}

/* ---------- film texture ---------- */
.grain{position:fixed;inset:-100px;z-index:70;pointer-events:none;opacity:.055;background:url(grain.png);animation:grain .9s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-37px,21px)}40%{transform:translate(23px,-41px)}60%{transform:translate(-51px,-9px)}80%{transform:translate(31px,47px)}}
.vig{position:fixed;inset:0;z-index:59;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,#0000 60%,#0006 100%)}

/* ---------- reduced motion: a still, stacked book ---------- */
.still .stage{position:relative;height:auto;overflow:visible}
.still .panel{position:relative;height:100vh;height:100svh;min-height:520px}
.still .p-open .bar.t{transform:scaleY(.42)}.still .p-open .bar.b{transform:scaleY(.42)}
.still .cr-stage{position:relative;height:auto;-webkit-mask-image:none;mask-image:none}
.still .roll{position:relative;padding:22vh var(--g) 18vh}
.still .cr-block{margin-bottom:16vh}
.still .cr-final{min-height:60vh;justify-content:center;margin-bottom:0}
.play{position:absolute;z-index:4;left:50%;bottom:calc(var(--g) + 48px);transform:translateX(-50%);color:var(--ink);border-bottom:1px solid #ece7df60;padding-bottom:5px}
@media (prefers-reduced-motion:reduce){.grain,.rec b,.cue i{animation:none}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>

<header class="hud">
  <i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
  <div class="h h-tl lbl" aria-hidden="true"><span class="rec"><b></b>Rec</span><span id="tc">00:00:00:00</span></div>
  <nav class="h h-tr lbl" aria-label="Site"><span id="h-city" aria-hidden="true"></span><a href="#contact" id="h-book">Contact</a></nav>
  <div class="h h-bl lbl" id="h-ch" aria-live="polite">Opening</div>
  <div class="h h-br lbl" id="h-sc" aria-hidden="true"></div>
</header>

<main>
  <section class="reel" id="reel" aria-label="Portfolio">
    <div class="stage" id="stage">
      <article class="panel p-open" aria-label="Opening titles">
        <div class="cam"><video muted loop playsinline preload="auto" aria-label="Studio film"></video></div>
        <div class="bar t"></div><div class="bar b"></div>
        <div class="title">
          <p class="lbl t-pre" id="t-pre"></p>
          <h1 class="name" id="t-name"></h1>
          <p class="lbl t-post" id="t-post"></p>
        </div>
        <div class="cue lbl" aria-hidden="true"><span>Scroll</span><i></i></div>
        <div class="shade"></div>
      </article>
    </div>
  </section>

  <section class="credits" id="credits" aria-label="Measurements and contact">
    <div class="cr-stage">
      <div class="roll" id="roll"></div>
    </div>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Frame viewer" tabindex="-1">
  <img alt="">
  <button class="lb-p" aria-label="Previous frame"></button><button class="lb-n" aria-label="Next frame"></button>
  <button class="lb-x lbl">Close</button>
  <div class="lb-bar lbl"><span class="lb-c"></span><span class="lb-t"></span></div>
</div>

<script src="../assets/content.js"></script>
<script src="js/gsap.min.js"></script>
<script src="js/ScrollTrigger.min.js"></script>
<script src="js/lenis.min.js"></script>
<script>
(() => {
const M = window.MODEL;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const base = document.documentElement.dataset.base || "";
const url = p => (/^(https?:)?\/\//.test(p) || p.startsWith("/") ? p : base + p);
const sm = p => url(p.replace(/\.jpg$/i, "-sm.jpg"));
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const prime = s => String(s).replace(/'/g, "′").replace(/"/g, "″");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const motion = !reduce && window.gsap && window.ScrollTrigger;
const full = `${M.first} ${M.last}`;
const mail = `mailto:${M.email}?subject=${encodeURIComponent("Booking enquiry — " + full)}`;
const ig = `https://instagram.com/${M.instagram}`;
const ROMAN = ["I", "II", "III", "IV", "V", "VI"];
const WORD = ["one", "two", "three", "four", "five", "six"];
const isTall = () => innerWidth / innerHeight < 0.9;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";

/* ---------- opening titles ---------- */
const nameEl = $("#t-name");
nameEl.setAttribute("aria-label", full);
nameEl.innerHTML = [...full].map(ch => ch === " " ? '<span class="sp" aria-hidden="true"> </span>' : `<span aria-hidden="true">${esc(ch)}</span>`).join("");
$("#t-pre").textContent = `${M.role} · ${M.city}`;
$("#h-city").textContent = M.city;
const video = $(".p-open video");
video.poster = url(M.video.poster);

/* ---------- acts: the night set first (it follows the dark studio film), lights up, then the colour coda ---------- */
const ACTS = [
  { key: "dark", name: "Low key", tone: "dark" },
  { key: "light", name: "High key", tone: "light" },
  { key: "colour", name: "In colour", tone: "colour" },
].map(a => ({ ...a, photos: M.photos.filter(p => p.key === a.key) }));
if (M.digitals && M.digitals.length) ACTS.push({ key: "digitals", name: "Digitals", tone: "light", photos: M.digitals.map(d => ({ fit: "portrait", key: "light", ...d })) });
const acts = ACTS.filter(a => a.photos.length);
$("#t-post").textContent = `A portfolio in ${WORD[acts.length - 1] || acts.length} acts`;

const stage = $("#stage");
const panels = [{ el: $(".p-open"), kind: "open", chapter: "Opening" }];
const book = [];
let sc = 0;
const total = acts.reduce((n, a) => n + a.photos.length, 0);

acts.forEach((a, ai) => {
  const first = sc + 1, last = sc + a.photos.length;
  const act = document.createElement("article");
  act.className = `panel p-act t-${a.tone}`;
  act.setAttribute("aria-label", `Act ${ROMAN[ai]}: ${a.name}`);
  act.innerHTML = `<div class="cam"><div class="act-in"><p class="lbl">Act ${ROMAN[ai]}</p><i class="rule"></i><h2 class="act-t">${esc(a.name)}</h2><p class="lbl act-s mute">${first === last ? `Scene ${pad(first)}` : `Scenes ${pad(first)} – ${pad(last)}`}</p></div></div><div class="shade"></div>`;
  stage.append(act);
  const chapter = `Act ${ROMAN[ai]} — ${a.name}`;
  panels.push({ el: act, kind: "act", chapter, roman: ROMAN[ai] });

  a.photos.forEach(p => {
    sc++;
    const i = book.length; book.push({ ...p, sc });
    const close = /close/i.test(p.caption || "");
    const s = document.createElement("article");
    s.className = `panel p-scene fit-${p.fit === "landscape" ? "landscape" : "portrait"} t-${a.tone}${close ? " closeup" : ""}`;
    const cap = esc(p.caption || `Scene ${pad(sc)}`);
    const sizes = close || p.fit === "landscape" ? "100vw" : "(min-aspect-ratio: 9/10) 67vh, 100vw";
    s.innerHTML = `<div class="cam"><div class="frame"><img alt="${esc(full)}, ${cap}" decoding="async" sizes="${sizes}"></div></div><div class="scrim"></div>
      <div class="slate"><p class="lbl">Scene ${pad(sc)}</p><h2><span class="ln"><span class="ln-i">${cap}</span></span></h2><button class="view lbl" data-i="${i}">View full frame</button></div><div class="shade"></div>`;
    stage.append(s);
    s.addEventListener("click", () => openLB(i));
    panels.push({ el: s, kind: "scene", chapter, sc, photo: p, img: $("img", s) });
  });
});

/* ---------- image loading (manual: frames live inside clipped panels, so no native lazy-loading) ---------- */
const probe = document.createElement("canvas"); probe.width = 24; probe.height = 36;
const pctx = probe.getContext("2d", { willReadFrequently: true });
function sample(p) {
  /* read the studio backdrop at each edge; where it is even, feather the frame into a matching ground */
  try {
    const im = p.img, w = 24, h = Math.max(12, Math.round(24 * im.naturalHeight / im.naturalWidth));
    probe.height = h; pctx.drawImage(im, 0, 0, w, h);
    const d = pctx.getImageData(0, 0, w, h).data;
    const px = (x, y) => { const k = (y * w + x) * 4; return [d[k], d[k + 1], d[k + 2]]; };
    const edge = arr => {
      const lum = arr.map(c => .2126 * c[0] + .7152 * c[1] + .0722 * c[2]);
      const m = lum.reduce((a, b) => a + b, 0) / lum.length;
      const sd = Math.sqrt(lum.reduce((a, b) => a + (b - m) ** 2, 0) / lum.length);
      const med = arr.map((c, i) => [lum[i], c]).sort((a, b) => a[0] - b[0])[arr.length >> 1][1];
      return { even: sd < 7 && Math.max(...lum) - Math.min(...lum) < 26, col: `rgb(${med})`, l: .2126 * med[0] + .7152 * med[1] + .0722 * med[2] };
    };
    const col = (x) => Array.from({ length: h }, (_, y) => px(x, y));
    const row = (y) => Array.from({ length: w }, (_, x) => px(x, y));
    const gl = p.el.classList.contains("t-light") ? 235 : 6; /* luminance of the act ground: bone / black */
    const sides = { l: edge(col(0)), r: edge(col(w - 1)), t: edge(row(0)), b: edge(row(h - 1)) };
    for (const [k, v] of Object.entries(sides)) {
      p.el.style.setProperty(`--f${k}`, v.even ? "9%" : "0%");
      /* an uneven edge keeps a hard frame line; its ground only follows the photo if it is near the act's own ground */
      if (v.even || Math.abs(v.l - gl) < 18) p.el.style.setProperty(`--b${k}`, v.col);
    }
  } catch (e) { /* cross-origin or decode issue: keep the act ground */ }
}
function load(p) {
  if (!p || !p.img || p.loaded) return;
  p.loaded = true;
  const im = p.img, src = p.photo.src;
  im.onload = () => { sample(p); im.classList.add("ld"); };
  im.srcset = `${sm(src)} 900w, ${url(src)} 2000w`;
  im.src = url(src);
}

/* ---------- lightbox: opens like a letterbox ---------- */
const lb = $("#lb"), lbImg = $("img", lb);
let lbi = 0, lbOpen = false, lastFocus = null, lenis = null;
lbImg.onload = () => lbImg.classList.add("ld");
function lbShow() {
  const p = book[lbi];
  lbImg.classList.remove("ld");
  lbImg.srcset = `${sm(p.src)} 900w, ${url(p.src)} 2000w`; lbImg.sizes = "94vw";
  lbImg.src = url(p.src); lbImg.alt = `${full}, ${p.caption}`;
  $(".lb-c", lb).textContent = `Sc ${pad(p.sc)} / ${pad(total)}`;
  $(".lb-t", lb).textContent = p.caption;
}
function openLB(i) {
  lbi = i; lbShow(); lastFocus = document.activeElement;
  lb.classList.add("open"); lbOpen = true;
  if (lenis) lenis.stop(); document.documentElement.style.overflow = "hidden";
  if (motion) gsap.fromTo(lb, { clipPath: "inset(50% 0% 50% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: .9, ease: "expo.inOut" });
  lb.focus({ preventScroll: true });
}
function closeLB() {
  if (!lbOpen) return; lbOpen = false;
  const done = () => { lb.classList.remove("open"); lb.style.clipPath = ""; };
  if (motion) gsap.to(lb, { clipPath: "inset(50% 0% 50% 0%)", duration: .7, ease: "expo.inOut", onComplete: done }); else done();
  if (lenis) lenis.start(); document.documentElement.style.overflow = "";
  if (lastFocus) lastFocus.focus({ preventScroll: true });
}
const go = d => { lbi = (lbi + d + book.length) % book.length; lbShow(); };
$(".lb-x", lb).onclick = closeLB;
$(".lb-p", lb).onclick = () => go(-1);
$(".lb-n", lb).onclick = () => go(1);
addEventListener("keydown", e => {
  if (!lbOpen) return;
  if (e.key === "Escape") closeLB();
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Tab") { const f = [$(".lb-x", lb), $(".lb-p", lb), $(".lb-n", lb)]; const k = f.indexOf(document.activeElement); e.preventDefault(); f[(k + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus(); }
});
let tx = 0;
lb.addEventListener("touchstart", e => (tx = e.touches[0].clientX), { passive: true });
lb.addEventListener("touchend", e => { const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) go(d < 0 ? 1 : -1); });

/* ---------- end credits ---------- */
const rows = M.stats.map(s => `<dt class="lbl">${esc(s[0])}</dt><dd>${esc(prime(s[1]))}${s[2] ? `<span class="imp">${esc(prime(s[2]))}</span>` : ""}</dd>`).join("");
const agency = M.agency && M.agency.name ? (M.agency.url ? `<a href="${esc(M.agency.url)}" target="_blank" rel="noopener">${esc(M.agency.name)}</a>` : esc(M.agency.name)) : "";
const facts = [["Based in", esc(M.city)], ["Available", esc(M.available)], agency && ["Representation", agency]].filter(Boolean)
  .map(r => `<dt class="lbl">${r[0]}</dt><dd>${r[1]}</dd>`).join("");
const clients = M.clients && M.clients.length ? `<div class="cr-block"><p class="lbl mute">Worked with</p><dl class="cr-rows">${M.clients.map((c, i) => `<dt class="lbl">${i ? "" : ""}</dt><dd>${esc(c)}</dd>`).join("")}</dl></div>` : "";
const comp = M.compCard ? `<a href="${url(M.compCard)}" download>Comp card (PDF)</a>` : `<a href="${mail}">Comp card on request</a>`;
const [mUser, mHost] = M.email.split("@");
$("#roll").innerHTML = `
  <div class="cr-block cr-star"><p class="lbl mute">Starring</p><p class="name" style="--ls:.2em">${esc(full)}</p></div>
  <div class="cr-block"><p class="lbl mute">Measurements</p><dl class="cr-rows">${rows}</dl></div>
  <div class="cr-block"><dl class="cr-rows">${facts}</dl></div>
  ${clients}
  <div class="cr-block cr-final" id="contact">
    <p class="lbl mute">For bookings</p>
    <a class="mail" href="${mail}">${esc(mUser)}<wbr>@${esc(mHost)}</a>
    <ul class="cr-links lbl"><li><a href="${ig}" target="_blank" rel="noopener">Instagram @${esc(M.instagram)}</a></li><li>${comp}</li></ul>
    <p class="cr-fin lbl mute"><span>© ${new Date().getFullYear()} ${esc(full)}</span><button id="rewind">Rewind to the top</button></p>
  </div>`;

/* ---------- HUD ---------- */
const hCh = $("#h-ch"), hSc = $("#h-sc"), tc = $("#tc");
let hudKey = "";
function hud(chapter, scene) {
  const k = chapter + scene; if (k === hudKey) return; hudKey = k;
  hCh.textContent = chapter; hSc.textContent = scene;
}
hud("Opening", `Sc 00 / ${pad(total)}`);
/* HUD ink follows the frame: dark on the white set, light everywhere else (close-ups carry a scrim) */
function setTone(p) {
  const cl = p.el.classList, tone = cl.contains("t-light") && !cl.contains("closeup") ? "light" : "dark";
  if (document.documentElement.dataset.tone !== tone) document.documentElement.dataset.tone = tone;
}
const t0 = performance.now();
(function tick() {
  const t = (performance.now() - t0) / 1000;
  tc.textContent = [Math.floor(t / 3600), Math.floor(t / 60) % 60, Math.floor(t) % 60, Math.floor((t % 1) * 24)].map(pad).join(":");
  requestAnimationFrame(tick);
})();

/* ================= still mode (reduced motion / no GSAP) ================= */
if (!motion) {
  document.documentElement.classList.add("still");
  video.preload = "none";
  const play = document.createElement("button");
  play.className = "play lbl"; play.textContent = "Play studio film";
  play.onclick = () => { video.src = url(M.video.src); video.play().catch(() => {}); play.remove(); };
  $(".p-open").append(play); $(".cue").remove();
  panels.forEach(p => { if (p.img) { p.img.loading = "lazy"; load(p); } });
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const p = panels.find(q => q.el === e.target); setTone(p); hud(p.chapter, p.sc ? `Sc ${pad(p.sc)} / ${pad(total)}` : "");
  }), { rootMargin: "-50% 0px -50% 0px" });
  panels.forEach(p => io.observe(p.el));
  new IntersectionObserver(([e]) => { if (e.isIntersecting) { document.documentElement.dataset.tone = "dark"; hud("End credits", ""); } }, { rootMargin: "-50% 0px -50% 0px" }).observe($("#credits"));
  $("#rewind").onclick = () => scrollTo(0, 0);
  return;
}

/* ================= motion ================= */
gsap.registerPlugin(ScrollTrigger);
video.src = url(M.video.src);
video.play().catch(() => {});
lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9 });
lenis.on("scroll", ScrollTrigger.update);
gsap.ticker.add(t => lenis.raf(t * 1000));
gsap.ticker.lagSmoothing(0);
scrollTo(0, 0);

/* letterbox: closed → scope (2.39:1, 4:5 on phones) on arrival → fully open on scroll */
const bt = $(".bar.t"), bb = $(".bar.b"), title = $(".title"), cue = $(".cue");
const bars = { intro: 0, open: 0 };
function renderBars() {
  const vw = innerWidth, vh = stage.clientHeight || innerHeight;
  const win = Math.min(vh, vw / (isTall() ? 0.8 : 2.39));
  const f = lerp(0.5, (vh - win) / 2 / vh, bars.intro) * (1 - bars.open);
  const s = Math.max(0, f / 0.505);
  bt.style.transform = bb.style.transform = `scaleY(${s})`;
}
renderBars();

const chars = $$("span", nameEl);
const intro = gsap.timeline({ delay: 0.2 });
intro
  .fromTo(".hud > *", { opacity: 0 }, { opacity: 1, duration: 0.9, stagger: 0.06, ease: "power2.out" }, 0)
  .to(bars, { intro: 1, duration: 1.9, ease: "expo.inOut", onUpdate: renderBars }, 0.25)
  .fromTo(chars, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 1.5, ease: "power2.out", stagger: { each: 0.055, from: "random" } }, 0.9)
  .fromTo(nameEl, { "--ls": isTall() ? ".42em" : ".62em" }, { "--ls": isTall() ? ".16em" : ".2em", duration: 3.4, ease: "expo.out" }, 0.9)
  .fromTo(["#t-pre", "#t-post"], { opacity: 0, y: 8 }, { opacity: 0.82, y: 0, duration: 1.3, stagger: 0.35, ease: "power3.out" }, 2.0)
  .fromTo(cue, { opacity: 0 }, { opacity: 1, duration: 1.2 }, 2.8)
  .add(() => chars.forEach(c => (c.style.filter = "")));

/* the reel: one scrubbed timeline across every panel */
const reel = $("#reel");
const tl = gsap.timeline({ paused: true, defaults: { ease: "none" } });
const P0 = panels[0];
P0.cam = $(".cam", P0.el); P0.shade = $(".shade", P0.el);
tl.to(bars, { open: 1, duration: 1, ease: "power2.inOut", onUpdate: renderBars }, 0)
  .to(title, { opacity: 0, scale: 1.07, duration: 0.75, ease: "power1.in" }, 0)
  .to(cue, { autoAlpha: 0, duration: 0.3 }, 0)
  .fromTo(P0.cam, { scale: 1.12 }, { scale: 1, duration: 1.5, ease: "power1.out" }, 0);
P0.mid = 0;
let t = 1.5;
for (let i = 1; i < panels.length; i++) {
  const p = panels[i], prev = panels[i - 1];
  p.cam = $(".cam", p.el); p.shade = $(".shade", p.el);
  const D = 1, iris = p.kind === "act";
  p.mid = t + D * 0.5;
  if (iris) {
    /* act cards: iris in */
    tl.fromTo(p.el, { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)", duration: D, ease: "power3.inOut" }, t)
      .fromTo(p.cam, { scale: 1.3 }, { scale: 1, duration: D * 1.3, ease: "power3.out" }, t)
      .to(prev.cam, { scale: 0.9, duration: D, ease: "power3.inOut" }, t)
      .fromTo($(".act-in", p.el), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45 }, t + 0.35)
      .fromTo($(".act-t", p.el), { "--ls": isTall() ? ".5em" : ".72em" }, { "--ls": ".24em", duration: 1.6, ease: "power2.out" }, t + 0.25)
      .fromTo($(".rule", p.el), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, t + 0.45)
      .fromTo($(".act-s", p.el), { autoAlpha: 0, y: 10 }, { autoAlpha: 0.55, y: 0, duration: 0.5, ease: "power2.out" }, t + 0.75);
  } else {
    /* scenes: a wipe from below; the new frame rides up inside its mask while the old one sinks back */
    tl.fromTo(p.el, { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: D, ease: "power3.inOut" }, t)
      .fromTo(p.cam, { yPercent: 26, scale: 1.12 }, { yPercent: 0, scale: 1, duration: D * 1.15, ease: "power3.out" }, t)
      .to(prev.cam, { yPercent: -14, duration: D, ease: "power3.inOut" }, t)
      .fromTo($(".ln-i", p.el), { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, t + 0.55)
      .fromTo($(".slate .lbl", p.el), { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, t + 0.5);
  }
  tl.to(prev.shade, { opacity: iris ? 0.9 : 0.72, duration: D, ease: "power2.in" }, t);
  const H = iris ? 0.9 : 1.25;
  if (p.kind === "scene") tl.fromTo($(".frame", p.el), { scale: 1 }, { scale: 1.045, duration: H + D, ease: "none" }, t + D);
  t += D + H;
}
const last = panels[panels.length - 1];
tl.to(last.shade, { opacity: 1, duration: 0.9, ease: "power1.in" }, t).to(last.cam, { scale: 0.96, duration: 0.9 }, t);
t += 0.9;
const END = t;

/* credits roll */
const credits = $("#credits"), roll = $("#roll"), crStage = $(".cr-stage");
const rollTl = gsap.timeline({ paused: true, defaults: { ease: "none" } });
let rollFrom = 0, rollTo = 0;
rollTl.fromTo(roll, { y: () => rollFrom }, { y: () => rollTo, duration: 1 });

let lastW = 0, unit = 0;
function layout(force) {
  if (!force && innerWidth === lastW) return;
  lastW = innerWidth;
  const vh = document.documentElement.clientHeight;
  unit = vh * (isTall() ? 0.58 : 0.62);
  reel.style.height = `${Math.round(END * unit + vh)}px`;
  const sh = crStage.clientHeight || vh;
  const fin = $("#contact");
  const centre = fin.offsetTop + fin.offsetHeight / 2;
  rollFrom = sh; rollTo = sh / 2 - centre;
  credits.style.height = `${Math.round(rollFrom - rollTo + sh)}px`;
  renderBars();
  ScrollTrigger.refresh();
}

ScrollTrigger.create({ trigger: reel, start: "top top", end: "bottom bottom", animation: tl, scrub: 0.6 });
tl.eventCallback("onUpdate", onReel);
ScrollTrigger.create({ trigger: credits, start: "top top", end: "bottom bottom", animation: rollTl, scrub: 0.5, invalidateOnRefresh: true,
  onToggle: s => { if (s.isActive) { hud("End credits", ""); document.documentElement.dataset.tone = "dark"; } else if (s.progress === 0) onReel(); } });

/* current panel → HUD, loading, visibility, video */
let cur = -1;
function onReel() {
  const time = tl.time();
  let c = 0;
  for (let i = 0; i < panels.length; i++) if (time >= panels[i].mid) c = i;
  if (time >= END - 0.2) { hud("End credits", ""); }
  if (c === cur) return;
  cur = c;
  const p = panels[c];
  setTone(p);
  if (time < END - 0.2) hud(p.chapter, p.sc ? `Sc ${pad(p.sc)} / ${pad(total)}` : p.kind === "act" ? `Act ${p.roman} / ${ROMAN[acts.length - 1]}` : `Sc 00 / ${pad(total)}`);
  panels.forEach((q, i) => { const v = i >= c - 1 && i <= c + 2 ? "" : "hidden"; if (q.el.style.visibility !== v) q.el.style.visibility = v; });
  for (let i = c; i <= c + 3; i++) load(panels[i]);
  if (c <= 1) video.play().catch(() => {}); else video.pause();
}
onReel();

/* everything else loads quietly in order once the opening is up */
addEventListener("load", () => {
  const queue = panels.filter(p => p.img);
  const next = () => { const p = queue.find(q => !q.loaded); if (!p) return; load(p); p.img.decode ? p.img.decode().catch(() => {}).then(() => setTimeout(next, 120)) : setTimeout(next, 400); };
  setTimeout(next, 900);
});

/* nav: contact fast-forwards, rewind rewinds */
const ff = (target, e) => { if (e) e.preventDefault(); lenis.scrollTo(target, { duration: 2.6, easing: x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2) }); };
$("#h-book").addEventListener("click", e => ff(document.documentElement.scrollHeight, e));
$("#rewind").addEventListener("click", e => ff(0, e));
$$(".view").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); openLB(+b.dataset.i); }));

layout(true);
addEventListener("resize", () => layout(false));
document.fonts && document.fonts.ready.then(() => layout(true));
})();
</script>
</body>
</html>
