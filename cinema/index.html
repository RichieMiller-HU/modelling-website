<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Richie Miller — Model</title>
<meta name="description" content="Richie Miller — model. Editorial, tailoring and campaign. Portfolio, film, measurements and booking.">
<meta property="og:title" content="Richie Miller — Model">
<meta property="og:image" content="../assets/photos/rm-16.jpg">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
:root{--bg:#050505;--ink:#efeae2;--mute:#7b766f;--line:#efeae21a;--rec:#e0402e;--serif:"Cormorant Garamond",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;--sans:var(--mono);--g:clamp(14px,2vw,30px)}
body{font:300 12px/1.5 var(--mono);letter-spacing:.04em}
.mono{font:400 10.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.mute{color:var(--mute)}

/* viewfinder HUD (fixed) */
.hud{position:fixed;inset:var(--g);z-index:60;pointer-events:none;color:#fff;mix-blend-mode:difference}
.hud i{position:absolute;width:22px;height:22px;border:1px solid currentColor}
.hud i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.hud i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.hud i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.hud i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.hud .tl{position:absolute;left:34px;top:4px;display:flex;gap:18px;align-items:center}
.hud .tr{position:absolute;right:34px;top:4px}
.hud .bl{position:absolute;left:34px;bottom:4px;display:flex;gap:18px}
.hud .br{position:absolute;right:34px;bottom:4px;font-variant-numeric:tabular-nums}
.rec{display:inline-flex;gap:8px;align-items:center}.rec b{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hud a{pointer-events:auto}

/* opening */
.open{height:240vh;position:relative}
.open-s{position:sticky;top:0;height:100vh;overflow:hidden;display:grid;place-items:center}
.open-s video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.7) contrast(1.08) saturate(.9)}
.bar{position:absolute;left:0;right:0;height:50vh;background:var(--bg);z-index:2;will-change:transform}
.bar.t{top:0}.bar.b{bottom:0}
.title{position:relative;z-index:3;text-align:center}
.title .mono{display:block;margin-bottom:22px;color:var(--ink);opacity:.8}
.title h1{font:300 clamp(56px,11vw,190px)/.85 var(--serif);letter-spacing:-.02em}
.title h1 em{font-style:italic}

/* scenes: sticky stack */
.scene{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--bg)}
.scene-in{position:absolute;inset:0;will-change:transform,filter;transform-origin:50% 30%}
.scene img{width:100%;height:100%;object-fit:cover}
.scene.portrait img{object-fit:contain;background:var(--bg)}
.scene .blur{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(60px) brightness(.45) saturate(.8);transform:scale(1.2)}
.scene.portrait .scene-in{display:grid;place-items:center}.scene.portrait .main{position:relative;height:86vh;width:auto;object-fit:cover;aspect-ratio:2/3;max-width:92vw}
@media (max-width:700px){.scene.landscape .scene-in{display:grid;place-items:center}.scene.landscape img{object-fit:contain;height:auto}.scene.portrait .main{height:auto;width:92vw}}
.slate{position:absolute;left:calc(var(--g) + 34px);bottom:calc(var(--g) + 40px);z-index:2;color:#fff;text-shadow:0 1px 18px #0008}
.slate h2{font:300 clamp(40px,6vw,96px)/.9 var(--serif);letter-spacing:-.02em;margin-top:10px}
.slate h2 em{font-style:italic}
.chapter{height:100vh;display:grid;place-items:center;text-align:center;position:sticky;top:0;background:var(--bg)}
.chapter h3{font:300 clamp(48px,8vw,140px)/.9 var(--serif)}
.chapter h3 em{font-style:italic;color:var(--mute)}
.chapter.light{background:#ece9e4;color:#0c0c0c;--mute:#8b8680}

/* credits */
.credits{position:relative;z-index:5;background:var(--bg);padding:30vh var(--g) 20vh;text-align:center}
.credits h4{font:italic 300 clamp(36px,4vw,64px)/1 var(--serif);margin-bottom:8vh}
.cr{max-width:560px;margin:0 auto}
.cr div{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:9px 0}
.cr div span:first-child{text-align:right;color:var(--mute)}.cr div span:last-child{text-align:left}
.cr .sp{height:6vh}
.end{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:34px;position:relative;z-index:5;background:var(--bg);padding:var(--g)}
.end a.big{font:300 clamp(48px,9vw,160px)/.9 var(--serif);letter-spacing:-.02em;transition:color .5s}
.end a.big em{font-style:italic}
.end a.big:hover{color:var(--mute)}
.end .links{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}
.end .links a{border-bottom:1px solid var(--line);padding-bottom:4px}
.end .links a:hover{border-color:var(--ink)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:59;background:radial-gradient(ellipse at center,transparent 55%,#0007 100%)}
@media (max-width:700px){.hud .bl span:nth-child(n+2),.hud .tr{display:none}.slate{left:var(--g);bottom:calc(var(--g) + 32px)}}
</style>
</head>
<body>
<div class="grain" style="--grain:.05"></div>
<div class="hud" aria-hidden="true"><i></i><i></i><i></i><i></i>
  <div class="tl mono"><span class="rec"><b></b>REC</span><span id="hud-scene">Scene 00</span></div>
  <div class="tr mono" id="hud-count"></div>
  <div class="bl mono"><span id="hud-name"></span><span>Studio</span><span id="hud-city"></span></div>
  <div class="br mono" id="tc">00:00:00:00</div>
</div>

<main>
  <section class="open" aria-label="Opening">
    <div class="open-s">
      <video muted loop playsinline autoplay preload="auto"></video>
      <div class="bar t"></div><div class="bar b"></div>
      <div class="title"><span class="mono" id="t-pre"></span><h1 id="t-h"></h1></div>
    </div>
  </section>
  <div id="scenes"></div>
  <section class="credits" aria-label="Measurements">
    <h4>Cast & measurements</h4>
    <div class="cr mono" id="cr"></div>
  </section>
  <section class="end" id="book">
    <span class="mono mute">Now casting — bookings open</span>
    <a class="big" id="e-mail"><em>Book</em> <span id="e-first"></span></a>
    <div class="links mono"><a id="e-m"></a><a id="e-ig" target="_blank" rel="noopener"></a><a id="e-cc"></a></div>
    <span class="mono mute" id="e-c"></span>
  </section>
</main>

<script src="../assets/content.js"></script>
<script src="../assets/core.js"></script>
<script>
(() => {
const { M, $, $$, clamp, lerp, url, reduce, onFrame, pinProgress, reveal, lightbox, mail, ig, pad, byKey } = K;
const full = `${M.first} ${M.last}`;
$("#hud-name").textContent = full; $("#hud-city").textContent = M.city;
$("#t-pre").textContent = `${M.role} · ${M.available}`;
$("#t-h").innerHTML = `${M.first} <em>${M.last}</em>`;
const v = $(".open video"); v.poster = url(M.video.poster); v.src = url(M.video.src);

/* scenes: dark chapter, then light chapter, then colour coda */
const chapters = [["dark", "Act I", "Low <em>key</em>"], ["light", "Act II", "High <em>key</em>"], ["colour", "Act III", "In <em>colour</em>"]];
const wrap = $("#scenes"); let sc = 0; const list = [];
chapters.forEach(([k, act, name]) => {
  const ps = byKey(k).slice(0, k === "colour" ? 3 : 5); if (!ps.length) return;
  const c = document.createElement("section"); c.className = "chapter" + (k === "light" ? " light" : ""); c.dataset.scene = act;
  c.innerHTML = `<div><span class="mono mute">${act}</span><h3>${name}</h3></div>`; wrap.append(c); list.push(c);
  ps.forEach(p => {
    sc++; const s = document.createElement("section"); s.className = "scene " + p.fit; s.dataset.scene = `Scene ${pad(sc)}`;
    const i = M.photos.indexOf(p);
    s.innerHTML = `<div class="scene-in"><img class="main" src="${url(p.src)}" alt="${full} — ${p.caption}" loading="lazy" decoding="async"></div><div class="slate"><span class="mono">Scene ${pad(sc)} · ${{ light: "High key", dark: "Low key", colour: "Colour" }[p.key]}</span><h2>${p.caption.replace(/(\S+)$/, "<em>$1</em>")}</h2></div>`;
    s.style.cursor = "zoom-in"; s.onclick = () => lightbox(M.photos, i);
    wrap.append(s); list.push(s);
  });
});

/* motion */
const open = $(".open"), bt = $(".bar.t"), bb = $(".bar.b"), title = $(".title");
let started = false;
onFrame(() => {
  const p = pinProgress(open);
  /* letterbox: closed → 2.39:1 on load → fully open while scrolling */
  const ratio = innerWidth < 700 ? 4 / 5 : 2.39;
  const base = started ? 0.5 - 0.5 / ratio * (innerWidth / innerHeight) : 0.5;
  const bar = Math.max(0, lerp(clamp(base, 0, .5), 0, clamp(p * 1.6)));
  bt.style.transform = `translateY(${-(1 - bar * 2) * 100}%)`; bb.style.transform = `translateY(${(1 - bar * 2) * 100}%)`;
  title.style.opacity = 1 - clamp(p * 2.2); title.style.transform = `scale(${1 + p * .15})`;
});
requestAnimationFrame(() => { setTimeout(() => { started = true; bt.style.transition = bb.style.transition = "transform 1.8s var(--ease-io)"; dispatchEvent(new Event("scroll")); setTimeout(() => bt.style.transition = bb.style.transition = "", 1900); }, 300); });

if (!reduce) onFrame(() => list.forEach((s, i) => {
  const nx = list[i + 1]; if (!nx) return;
  const r = nx.getBoundingClientRect(); const p = clamp(1 - r.top / innerHeight);
  const inner = s.querySelector(".scene-in") || s.firstElementChild;
  inner.style.transform = `scale(${1 - p * .12}) translateY(${-p * 6}vh)`; inner.style.filter = `brightness(${1 - p * .65})`;
}));

/* HUD: scene label + running timecode */
$("#hud-count").textContent = `${sc} scenes · ${M.city}`;
const hs = $("#hud-scene"), tc = $("#tc"); const t0 = performance.now();
onFrame(() => { let cur = "Opening"; for (const s of list) if (s.getBoundingClientRect().top <= innerHeight * .5) cur = s.dataset.scene; hs.textContent = cur; });
(function tick() { const t = (performance.now() - t0) / 1000; tc.textContent = [Math.floor(t / 3600), Math.floor(t / 60) % 60, Math.floor(t) % 60, Math.floor((t % 1) * 24)].map(pad).join(":"); requestAnimationFrame(tick); })();

/* credits */
const rows = [["Starring", full], ["Role", M.role], ["Based", M.city], [""], ...M.stats.map(s => [s[0], s[2] ? `${s[1]} / ${s[2]}` : s[1]]), [""], ["Representation", M.agency.name], ["Available", M.available]];
if (M.clients.length) rows.push([""], ["Worked with", M.clients.join(" · ")]);
$("#cr").innerHTML = rows.map(r => r.length === 1 ? `<div class="sp"></div>` : `<div data-reveal><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
$("#e-mail").href = mail(); $("#e-first").textContent = M.first;
$("#e-m").href = mail(); $("#e-m").textContent = M.email;
$("#e-ig").href = ig(); $("#e-ig").textContent = "@" + M.instagram;
if (M.compCard) { $("#e-cc").href = url(M.compCard); $("#e-cc").download = ""; $("#e-cc").textContent = "Comp card ↓"; } else { $("#e-cc").href = mail(); $("#e-cc").textContent = "Comp card on request"; }
$("#e-c").textContent = `© ${new Date().getFullYear()} ${full} — Fin.`;
reveal();
})();
</script>
</body>
</html>
