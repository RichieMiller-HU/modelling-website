<!doctype html>
<html lang="en" data-base="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Richie Miller — Model, Budapest</title>
<meta name="description" content="Richie Miller, model based in Budapest. Editorial, tailoring and campaign. Portfolio, studio film, measurements and bookings.">
<meta property="og:title" content="Richie Miller — Model">
<meta property="og:image" content="../assets/photos/rm-16.jpg">
<meta name="theme-color" content="#0a0a09">
<!--
  Noir II — an original build for Richie Miller (no third-party template code adapted).
  Vendored, unmodified: GSAP 3.15.1 + ScrollTrigger (GreenSock standard no-charge licence, vendor/LICENSE-gsap.txt),
  Lenis 1.3.27 (MIT, vendor/LICENSE-lenis.txt). Fonts: Libre Caslon Display, Host Grotesk (SIL OFL 1.1, fonts/).
-->
<link rel="preload" href="fonts/libre-caslon-display-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/host-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/video/studio-poster.jpg" as="image">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pre" aria-hidden="true"><span class="pre-name">Richie Miller</span><span class="pre-bar"><i></i></span></div>
<div class="grain" aria-hidden="true"></div>

<header class="nav">
  <a class="nav-mark" href="#top" aria-label="Back to top"></a>
  <nav aria-label="Primary">
    <a class="lbl" href="#work">Work</a>
    <a class="lbl" href="#film">Film</a>
    <a class="lbl opt" href="#measurements">Measurements</a>
    <a class="lbl" href="#contact">Contact</a>
  </nav>
</header>

<main id="top">
  <section class="hero" aria-label="Introduction">
    <div class="hero-pin">
      <div class="hero-frame">
        <video muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
        <span class="hero-shade"></span>
      </div>
      <h1 class="hero-name d-xl"><span class="hn hn-1"></span><span class="hn hn-2"></span></h1>
      <div class="hero-meta lbl"><span id="h-role"></span><span class="cue" aria-hidden="true">Scroll<i></i></span><span id="h-city"></span></div>
    </div>
  </section>

  <section class="profile grid" aria-label="Profile">
    <p class="lbl mute">Profile</p>
    <p class="statement d-m" id="statement"></p>
    <div class="facts" id="facts"></div>
  </section>

  <section class="ix" id="work" aria-label="Selected work, contents">
    <div class="ix-h">
      <h2 class="d-l">Selected work</h2>
      <p class="mute" id="ix-note"></p>
    </div>
    <nav class="ix-rows" id="rows" aria-label="Contents"></nav>
  </section>

  <section class="book" id="book" aria-label="The book">
    <div class="book-pin">
      <div class="book-track" id="track"></div>
      <div class="book-head lbl" aria-hidden="true"><span id="bk-ch"></span><span class="book-bar"><i></i></span><span class="num"><span id="bk-n">01</span> / <span id="bk-t"></span></span></div>
    </div>
  </section>

  <section class="cu" aria-label="Close-up">
    <div class="cu-pin">
      <div class="cu-frame" id="cu-frame" data-cursor="View" role="button" tabindex="0" aria-label="Open close-up"><img id="cu-img" alt="" decoding="async"></div>
      <p class="cu-cap lbl"><span>Close-up</span><span id="cu-c"></span></p>
    </div>
  </section>

  <section class="film" id="film" aria-label="Studio film">
    <div class="film-pin">
      <span class="film-w film-w1" aria-hidden="true">Studio</span><span class="film-w film-w2" aria-hidden="true">Film</span>
      <div class="film-frame" data-cursor="Sound"><video muted loop playsinline preload="metadata"></video></div>
      <div class="film-ui lbl"><span>Studio film <span class="num" id="dur"></span></span><div><button id="snd" type="button">Sound on</button><button id="pp" type="button">Pause</button></div></div>
    </div>
  </section>

  <section class="dg-sec grid" id="digitals" aria-label="Digitals" data-hide-empty="digitals">
    <h2 class="d-l">Digitals</h2>
    <div class="dg" id="dg"></div>
  </section>

  <section class="meas grid" id="measurements" aria-label="Measurements">
    <div class="meas-h">
      <h2 class="d-m">Measurements</h2>
      <div class="unit lbl" role="group" aria-label="Units"><button type="button" aria-pressed="true" data-u="1">cm</button><span>/</span><button type="button" aria-pressed="false" data-u="2">in</button></div>
    </div>
    <dl class="stats" id="stats"></dl>
  </section>

  <section class="ct" id="contact" aria-label="Contact">
    <div>
      <p class="lbl mute">Bookings &amp; enquiries</p>
      <div class="ct-grid">
        <div><span class="lbl mute">Email</span><a id="c-mail"></a><button class="copy lbl" id="c-copy" type="button">Copy address</button></div>
        <div><span class="lbl mute">Instagram</span><a id="c-ig" target="_blank" rel="noopener"></a></div>
        <div><span class="lbl mute">Representation</span><span class="v" id="c-ag"></span></div>
        <div><span class="lbl mute">Comp card</span><a id="c-cc"></a></div>
      </div>
    </div>
    <div>
      <a class="ct-big" id="ct-mail" data-cursor="Write"><span class="t" id="ct-t"></span><svg class="arr" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 16 4M7 4h9v9" fill="none" stroke="currentColor" stroke-width="1"/></svg></a>
      <div class="foot lbl"><span id="f-l"></span><span class="num" id="clock"></span><a href="#top">Back to top</a></div>
    </div>
  </section>
</main>

<div class="ix-float" id="float" aria-hidden="true"><div class="ix-float-c" id="float-c"></div></div>

<div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-ui lbl"><span class="num" id="lb-n"></span><span id="lb-c"></span><button class="lb-x lbl" type="button">Close</button></div>
  <div class="lb-stage"><img alt=""></div>
  <button class="lb-prev" type="button" aria-label="Previous photo" data-cursor="Prev"></button>
  <button class="lb-next" type="button" aria-label="Next photo" data-cursor="Next"></button>
  <div class="lb-foot lbl"><span>Use arrow keys or swipe</span><span>Esc to close</span></div>
</div>

<script src="../assets/content.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="main.js"></script>
</body>
</html>
